# Clyps numa VPS: tudo em um servidor (app web + API + fila de cortes), com o Caddy na frente.
# Uso: cp .env.example .env  →  docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    environment:
      # Transcrição local pelo Speaches (container abaixo). Para usar outro serviço, defina STT_PROVIDER no .env.
      STT_PROVIDER: ${STT_PROVIDER:-speaches}
      SPEACHES_URL: http://speaches:8000/v1
      SPEACHES_MODEL: ${SPEACHES_MODEL:-Systran/faster-whisper-small}
    volumes:
      - clyps_data:/data
    depends_on:
      - speaches
    restart: unless-stopped

  # Whisper rodando na própria VPS (https://speaches.ai). Só o app enxerga este serviço; nenhuma porta é aberta.
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    environment:
      PRELOAD_MODELS: '["${SPEACHES_MODEL:-Systran/faster-whisper-small}"]'
      WHISPER__COMPUTE_TYPE: int8
      STT_MODEL_TTL: ${SPEACHES_MODEL_TTL:-600}
      ENABLE_UI: "false"
    volumes:
      - speaches_models:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  clyps_data:
  caddy_data:
  speaches_models:
