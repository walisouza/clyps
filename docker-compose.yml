# Clyps numa VPS: tudo em um servidor (app web + API + fila de cortes), com o Caddy na frente.
# Uso: cp .env.example .env  →  docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    volumes:
      - clyps_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  clyps_data:
  caddy_data:
