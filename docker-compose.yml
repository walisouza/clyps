# Clyps numa VPS: app web (Caddy) + worker de cortes.
# Uso: cp .env.example .env  →  preencher  →  docker compose up -d --build
services:
  web:
    build:
      context: ./web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
    restart: unless-stopped

  worker:
    build: ./worker
    env_file: .env
    restart: unless-stopped

volumes:
  caddy_data:
